# ---------------------------------------------------------------------------
# Journals dedicated to sexuality research. Essentially everything they publish
# is on topic, so NO keyword filter is applied -- we take all of it.
# Names must match PubMed's indexed title exactly (verified against PubMed).
# ---------------------------------------------------------------------------
topic_journals:
  - "Archives of sexual behavior"
  - "Journal of sex research"
  - "The journal of sexual medicine"
  - "Sexual medicine reviews"
  - "Culture, health & sexuality"
  - "Psychology and sexuality"   # sparsely indexed in PubMed (~21 papers total)

# ---------------------------------------------------------------------------
# General-scope journals. These publish hundreds of unrelated papers a day
# (Scientific Reports alone is ~200/day), so the keyword list below is pushed
# INTO the PubMed query rather than applied afterwards -- otherwise we'd only
# ever see an arbitrary truncated slice of each day's output.
#
# Editorial note: you wanted Nature Medicine only for practice-changing results
# and npj Women's Health only when women-focused. Neither is mechanizable, so
# both are simply included -- expect to skip some manually. Volume is low
# (npj Women's Health has 48 papers total), so this is rarely a burden.
# ---------------------------------------------------------------------------
general_journals:
  - "Nature human behaviour"
  - "Nature communications"
  - "Communications psychology"
  - "Scientific reports"
  - "Nature mental health"
  - "Nature medicine"
  - "npj women's health"

# Applied as a title/abstract query against general_journals only.
keywords:
  - "sexual behavior"
  - "sexual behaviour"
  - "sexual desire"
  - "sexual health"
  - "sexual function"
  - "sexual dysfunction"
  - "sexual satisfaction"
  - "sexual orientation"
  - "sexual violence"
  - "sexuality"
  - "intimacy"
  - "sexual consent"
  - "relationship satisfaction"
  - "contraception"
  - "erectile"
  - "orgasm"

# Dropped if any of these appear in the title/abstract. The general journals
# publish a lot of animal mating-behaviour work that matches "sexual behavior"
# but is not what this channel covers. (A humans[MeSH] filter would be cleaner,
# but MeSH terms are assigned weeks after publication, so it would exclude
# everything recent.)
exclude_keywords:
  - "mice"
  - "mouse"
  - "rats"
  - "rat "
  - "drosophila"
  - "zebrafish"
  - "c. elegans"
  - "macaque"
  - "primate"
  - "songbird"
  - "beetle"
  - "insect"
  - "livestock"
  # NB: do not add "in vitro" here -- it matches "in vitro fertilization",
  # which is exactly the clinical reproductive work this channel wants.
  # evolutionary-biology framing: reliably animal work, never this channel's topic
  - "sexual selection"
  - "experimental evolution"
  - "evolutionary biology"
  - "phylogen"
  - "conspecific"

# Which API writes the summaries: "you" (You.com Research, YOU_API_KEY) or
# "anthropic" (ANTHROPIC_API_KEY). You.com is fast (~5s) and inexpensive.
summarizer: "you"

# You.com only: "lite", "standard", or "deep". The abstract is supplied in the
# prompt and outside sources are explicitly disallowed, so there is nothing for
# the higher efforts to research -- "lite" is the right choice here.
you_research_effort: "lite"

# Archive mode (--classic, or --fallback-classic when nothing new was found):
# the most-cited paper from these years, via Europe PMC's citation counts.
# PubMed itself has no citation data, which is why that one search uses a
# different source. Keep the upper bound a couple of years back -- recent
# papers haven't had time to accumulate citations.
classic_year_from: 2005
classic_year_to: 2024

# How many days back to search each run (run daily -> 1-2 is usually enough;
# set higher for the first run to backfill, or use --lookback).
lookback_days: 2

# Max number of papers to post per run. Keep at 1 for "one paper a day" style.
max_posts_per_run: 1

# Where finished posts go. "markdown" writes local files you can feed to any
# static site generator (Hugo/Jekyll/Astro). "wordpress" posts directly via
# the WP REST API (requires WORDPRESS_* vars in .env).
publish_target: "markdown"
