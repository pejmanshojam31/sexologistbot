# Journals to search. Must match PubMed's indexed journal name.
# Add/remove freely -- these are just sensible defaults for human sexuality research.
journals:
  - "Archives of Sexual Behavior"
  - "Journal of Sex Research"
  - "Journal of Sexual Medicine"
  - "Psychology & Sexuality"
  - "Sexual and Relationship Therapy"
  - "Culture, Health & Sexuality"

# Paper is selected only if title/abstract matches at least one keyword (case-insensitive).
# Edit this list to match what you actually want covered.
keywords:
  - "sexual behavior"
  - "sexual behaviour"
  - "sexual desire"
  - "sexual health"
  - "intimacy"
  - "sexual orientation"
  - "sexual satisfaction"
  - "sexual dysfunction"
  - "relationship satisfaction"

# How many days back to search each run (run daily -> 1-2 is usually enough;
# set higher for the first run to backfill).
lookback_days: 2

# Max number of papers to post per run. Keep at 1 for "one paper a day" style.
max_posts_per_run: 1

# Where finished posts go. "markdown" writes local files you can feed to any
# static site generator (Hugo/Jekyll/Astro). "wordpress" posts directly via
# the WP REST API (requires WORDPRESS_* vars in .env).
publish_target: "markdown"
