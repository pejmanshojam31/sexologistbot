name: Daily paper post

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC every day - edit to your preferred time
  workflow_dispatch: {}    # lets you also trigger it manually from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for the commit-back step below to push
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python main.py

      - name: Commit new post + updated posted-id log
        run: |
          git config user.name "paper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/ data/posted_ids.json
          git diff --staged --quiet && echo "Nothing new to commit." && exit 0
          git commit -m "Daily paper post"
          git pull --rebase --autostash
          git push
