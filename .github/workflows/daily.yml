name: Daily paper post

on:
  schedule:
    # 07:00 UTC = 09:00 in central Europe during summer (CEST, UTC+2).
    # Note: this does NOT auto-adjust for winter -- when clocks go back to CET
    # (UTC+1) in late October, this fires at 08:00 local. Change to "0 8 * * *"
    # then if you want it to stay at 09:00 year-round.
    - cron: "0 7 * * *"
  workflow_dispatch: {}    # lets you also trigger it manually from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for the commit-back step below to push
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          # summarizer: "you" in config/settings.yaml -> only YOU_API_KEY is needed.
          # ANTHROPIC_API_KEY is only used if you switch the summarizer over.
          YOU_API_KEY: ${{ secrets.YOU_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        # --fallback-classic: these journals don't publish daily, so on quiet
        # days post the most-cited paper from earlier years instead of nothing.
        run: python main.py --fallback-classic

      - name: Commit new post + updated posted-id log
        run: |
          git config user.name "paper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/ data/posted_ids.json data/posted_films.json
          git diff --staged --quiet && echo "Nothing new to commit." && exit 0
          git commit -m "Daily paper post"
          git pull --rebase --autostash
          git push
